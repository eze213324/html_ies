<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soy de IES</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333333;
            margin-bottom: 20px;
        }
        img {
            max-width: 300px;
            height: auto;
            margin-bottom: 20px;
        }
        a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #0056b3;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        a:hover {
            background-color: #003d80;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Soy de IES</h1>
        
        <!-- Imagen -->
        <img src="https://ies21.edu.ar/wp-content/uploads/2025/11/LOGO_IES21.png" alt="Logo IES">
        
        <br>
        
        <!-- Enlace a la web oficial -->
        <a href="https://www.ies21.edu.ar" target="_blank" rel="noopener noreferrer">Ir al sitio web de IES</a>
    </div>

</body>
</html>
